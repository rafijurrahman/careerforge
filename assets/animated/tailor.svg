<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <title>CareerForge Tailor Engine — Deterministic Experience Selection</title>
  <desc>Demonstrates how CareerForge scans job description keywords and selects matching bullets from your verified profile into a 1-page CV without fabricating facts.</desc>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-accent: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --green-border: #86efac;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
      --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --card-bg: #111827;
        --border: #1f2937;
        --border-accent: #374151;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        --accent: #3b82f6;
        --accent-bg: #1e293b;
        --green: #22c55e;
        --green-bg: #064e3b;
        --green-border: #059669;
        --badge-bg: #0c4a6e;
        --badge-text: #38bdf8;
      }
    }

    text {
      font-family: var(--font);
      user-select: none;
    }

    .box {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1.5;
      rx: 8;
    }

    /* Keyframe Animations */
    @keyframes dimUnmatched {
      0%, 15% { opacity: 0.9; }
      30%, 85% { opacity: 0.22; }
      95%, 100% { opacity: 0.9; }
    }

    @keyframes highlightMatch {
      0%, 15% {
        fill: var(--card-bg);
        stroke: var(--border);
      }
      30%, 85% {
        fill: var(--green-bg);
        stroke: var(--green-border);
      }
      95%, 100% {
        fill: var(--card-bg);
        stroke: var(--border);
      }
    }

    @keyframes matchText {
      0%, 15% { fill: var(--text-muted); font-weight: normal; }
      30%, 85% { fill: var(--green); font-weight: 600; }
      95%, 100% { fill: var(--text-muted); font-weight: normal; }
    }

    @keyframes docBulletSlide {
      0%, 30% { opacity: 0; transform: translateX(-15px); }
      45%, 85% { opacity: 1; transform: translateX(0); }
      95%, 100% { opacity: 0; transform: translateX(5px); }
    }

    @keyframes scorePulse {
      0%, 30% { opacity: 0.5; fill: var(--text-muted); }
      45%, 85% { opacity: 1; fill: var(--green); font-weight: bold; }
      95%, 100% { opacity: 0.5; fill: var(--text-muted); }
    }

    @keyframes keywordGlow {
      0%, 15% { stroke: var(--border); fill: var(--card-bg); }
      25%, 85% { stroke: var(--accent); fill: var(--accent-bg); }
      95%, 100% { stroke: var(--border); fill: var(--card-bg); }
    }

    .bullet-dim { animation: dimUnmatched 7s infinite ease-in-out; }
    .bullet-match { animation: highlightMatch 7s infinite ease-in-out; }
    .bullet-match-text { animation: matchText 7s infinite ease-in-out; }
    .doc-bullet { animation: docBulletSlide 7s infinite ease-in-out; }
    .score-text { animation: scorePulse 7s infinite ease-in-out; }
    .kw-pill { animation: keywordGlow 7s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .bullet-dim { opacity: 0.25 !important; animation: none !important; }
      .bullet-match { fill: var(--green-bg) !important; stroke: var(--green-border) !important; animation: none !important; }
      .bullet-match-text { fill: var(--green) !important; font-weight: 600 !important; animation: none !important; }
      .doc-bullet { opacity: 1 !important; transform: none !important; animation: none !important; }
      .score-text { opacity: 1 !important; fill: var(--green) !important; animation: none !important; }
      .kw-pill { stroke: var(--accent) !important; fill: var(--accent-bg) !important; animation: none !important; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="var(--bg)" rx="10" />
  <rect x="1" y="1" width="798" height="318" fill="none" stroke="var(--border)" stroke-width="1.5" rx="9" />

  <!-- Top Title / Header -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="var(--text)" letter-spacing="0.5">CAREERFORGE :: EXPERIENCE TAILOR</text>
    <rect x="250" y="-12" width="135" height="18" rx="9" fill="var(--badge-bg)" />
    <text x="317" y="1" font-size="9.5" font-weight="600" fill="var(--badge-text)" text-anchor="middle">100% DETERMINISTIC</text>
  </g>

  <!-- LEFT PANEL: Candidate Profile Pool -->
  <g transform="translate(30, 42)">
    <rect class="box" width="310" height="236" />
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 302 0 A 8 8 0 0 1 310 8 L 310 24 L 0 24 Z" fill="var(--border)" opacity="0.25" />
    <text x="12" y="16" font-size="10" font-weight="600" fill="var(--text-muted)">profile.yaml (Verified Experience Pool: 12 Bullets)</text>

    <!-- Bullets List -->
    <!-- Bullet 1: Match (Python / Kafka) -->
    <g transform="translate(10, 32)">
      <rect class="bullet-match" width="290" height="16" rx="4" />
      <circle cx="8" cy="8" r="2.5" fill="var(--green)" />
      <text class="bullet-match-text" x="18" y="11.5" font-size="8.5">Engineered data pipeline with Python &amp; Kafka (840ms p95)</text>
    </g>

    <!-- Bullet 2: Dim -->
    <g class="bullet-dim" transform="translate(10, 51)">
      <rect width="290" height="16" rx="4" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1" />
      <circle cx="8" cy="8" r="2" fill="var(--text-dim)" />
      <text x="18" y="11.5" font-size="8.5" fill="var(--text-muted)">Coordinated quarterly dependency security upgrades</text>
    </g>

    <!-- Bullet 3: Match (FastAPI) -->
    <g transform="translate(10, 70)">
      <rect class="bullet-match" width="290" height="16" rx="4" />
      <circle cx="8" cy="8" r="2.5" fill="var(--green)" />
      <text class="bullet-match-text" x="18" y="11.5" font-size="8.5">Rewrote auth microservices using FastAPI (cut latency 50%)</text>
    </g>

    <!-- Bullet 4: Dim -->
    <g class="bullet-dim" transform="translate(10, 89)">
      <rect width="290" height="16" rx="4" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1" />
      <circle cx="8" cy="8" r="2" fill="var(--text-dim)" />
      <text x="18" y="11.5" font-size="8.5" fill="var(--text-muted)">Maintained internal team Confluence onboarding docs</text>
    </g>

    <!-- Bullet 5: Match (Redis) -->
    <g transform="translate(10, 108)">
      <rect class="bullet-match" width="290" height="16" rx="4" />
      <circle cx="8" cy="8" r="2.5" fill="var(--green)" />
      <text class="bullet-match-text" x="18" y="11.5" font-size="8.5">Architected distributed caching layer using Redis clusters</text>
    </g>

    <!-- Bullet 6: Dim -->
    <g class="bullet-dim" transform="translate(10, 127)">
      <rect width="290" height="16" rx="4" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1" />
      <circle cx="8" cy="8" r="2" fill="var(--text-dim)" />
      <text x="18" y="11.5" font-size="8.5" fill="var(--text-muted)">Facilitated bi-weekly sprint planning and retrospectives</text>
    </g>

    <!-- Bullet 7: Match (PostgreSQL) -->
    <g transform="translate(10, 146)">
      <rect class="bullet-match" width="290" height="16" rx="4" />
      <circle cx="8" cy="8" r="2.5" fill="var(--green)" />
      <text class="bullet-match-text" x="18" y="11.5" font-size="8.5">Tuned PostgreSQL query execution plans and index trees</text>
    </g>

    <!-- Bullet 8: Dim -->
    <g class="bullet-dim" transform="translate(10, 165)">
      <rect width="290" height="16" rx="4" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1" />
      <circle cx="8" cy="8" r="2" fill="var(--text-dim)" />
      <text x="18" y="11.5" font-size="8.5" fill="var(--text-muted)">Evaluated third-party SaaS analytics vendor contracts</text>
    </g>

    <!-- Bullet 9: Match (Docker) -->
    <g transform="translate(10, 184)">
      <rect class="bullet-match" width="290" height="16" rx="4" />
      <circle cx="8" cy="8" r="2.5" fill="var(--green)" />
      <text class="bullet-match-text" x="18" y="11.5" font-size="8.5">Standardized developer staging containers via Docker</text>
    </g>

    <!-- Bullet 10: Dim -->
    <g class="bullet-dim" transform="translate(10, 203)">
      <rect width="290" height="16" rx="4" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1" />
      <circle cx="8" cy="8" r="2" fill="var(--text-dim)" />
      <text x="18" y="11.5" font-size="8.5" fill="var(--text-muted)">Monitored Slack alerts from legacy batch cron jobs</text>
    </g>
  </g>

  <!-- MIDDLE: JD Requirements & Matching Logic -->
  <g transform="translate(355, 60)">
    <text x="60" y="15" font-size="9" font-weight="600" fill="var(--text-muted)" text-anchor="middle">TARGET JD SKILLS</text>

    <!-- Keywords -->
    <g class="kw-pill" transform="translate(15, 26)">
      <rect width="90" height="18" rx="9" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1.2" />
      <text x="45" y="12" font-size="8.5" font-weight="600" fill="var(--accent)" text-anchor="middle">Python</text>
    </g>
    <g class="kw-pill" transform="translate(15, 49)">
      <rect width="90" height="18" rx="9" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1.2" />
      <text x="45" y="12" font-size="8.5" font-weight="600" fill="var(--accent)" text-anchor="middle">FastAPI</text>
    </g>
    <g class="kw-pill" transform="translate(15, 72)">
      <rect width="90" height="18" rx="9" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1.2" />
      <text x="45" y="12" font-size="8.5" font-weight="600" fill="var(--accent)" text-anchor="middle">Redis</text>
    </g>
    <g class="kw-pill" transform="translate(15, 95)">
      <rect width="90" height="18" rx="9" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1.2" />
      <text x="45" y="12" font-size="8.5" font-weight="600" fill="var(--accent)" text-anchor="middle">PostgreSQL</text>
    </g>
    <g class="kw-pill" transform="translate(15, 118)">
      <rect width="90" height="18" rx="9" fill="var(--card-bg)" stroke="var(--border)" stroke-width="1.2" />
      <text x="45" y="12" font-size="8.5" font-weight="600" fill="var(--accent)" text-anchor="middle">Docker</text>
    </g>

    <!-- Arrow / Connector to Output -->
    <path d="M 60 148 L 60 178 M 60 178 L 75 168 M 60 178 L 45 168" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="200" font-size="9" font-weight="700" fill="var(--accent)" text-anchor="middle">Score: 100%</text>
  </g>

  <!-- RIGHT PANEL: 1-Page Tailored Document -->
  <g transform="translate(490, 42)">
    <!-- Document Page Shadow & Body -->
    <rect class="box" width="280" height="236" stroke-width="2" />
    <!-- Top Doc Header Strip -->
    <rect x="0" y="0" width="280" height="32" rx="8" fill="var(--border)" opacity="0.2" />
    <text x="14" y="15" font-size="10.5" font-weight="700" fill="var(--text)">ALEX RIVERA — BACKEND CV</text>
    <text x="14" y="26" font-size="8" fill="var(--text-muted)">1-Page Strict ATS Layout (Font scale: 1.06)</text>

    <text x="14" y="47" font-size="8.5" font-weight="700" fill="var(--accent)">RELEVANT WORK EXPERIENCE</text>
    <line x1="14" y1="51" x2="266" y2="51" stroke="var(--border)" stroke-width="1" />

    <!-- Injected Tailored Bullets (Animated into Document) -->
    <g class="doc-bullet" transform="translate(14, 60)">
      <rect width="252" height="28" rx="4" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1" />
      <circle cx="8" cy="14" r="2.5" fill="var(--green)" />
      <text x="16" y="12" font-size="8" font-weight="600" fill="var(--text)">Python &amp; Kafka Event Stream</text>
      <text x="16" y="22" font-size="7.5" fill="var(--text-muted)">Engineered pipeline achieving 840ms p95 latency.</text>
    </g>

    <g class="doc-bullet" transform="translate(14, 94)">
      <rect width="252" height="28" rx="4" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1" />
      <circle cx="8" cy="14" r="2.5" fill="var(--green)" />
      <text x="16" y="12" font-size="8" font-weight="600" fill="var(--text)">FastAPI Authentication Migration</text>
      <text x="16" y="22" font-size="7.5" fill="var(--text-muted)">Cut request latency 50% across 20k daily active users.</text>
    </g>

    <g class="doc-bullet" transform="translate(14, 128)">
      <rect width="252" height="28" rx="4" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1" />
      <circle cx="8" cy="14" r="2.5" fill="var(--green)" />
      <text x="16" y="12" font-size="8" font-weight="600" fill="var(--text)">Redis Cluster Cache Layer</text>
      <text x="16" y="22" font-size="7.5" fill="var(--text-muted)">Reduced PostgreSQL read load by 68% in production.</text>
    </g>

    <g class="doc-bullet" transform="translate(14, 162)">
      <rect width="252" height="28" rx="4" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1" />
      <circle cx="8" cy="14" r="2.5" fill="var(--green)" />
      <text x="16" y="12" font-size="8" font-weight="600" fill="var(--text)">PostgreSQL &amp; Docker Staging</text>
      <text x="16" y="22" font-size="7.5" fill="var(--text-muted)">Optimized query plans; standardized test environments.</text>
    </g>

    <!-- Bottom Page Guarantee Footer inside Document -->
    <rect x="14" y="200" width="252" height="24" rx="4" fill="var(--border)" opacity="0.3" />
    <text class="score-text" x="140" y="215" font-size="9" font-weight="600" text-anchor="middle">ATS Match: 100% | Verified 1 Page</text>
  </g>

  <!-- Bottom Global Banner / Tagline -->
  <g transform="translate(400, 304)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="var(--text)" text-anchor="middle" letter-spacing="0.2">
      "Selects from your real experience. Invents nothing."
    </text>
  </g>
</svg>
