<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <title>CareerForge Track Engine — Kanban Pipeline &amp; Ghost Detection</title>
  <desc>Demonstrates how CareerForge tracks applications across 5 stages and detects ghosted applications locally in SQLite.</desc>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --col-bg: #f1f5f9;
      --col-header: #e2e8f0;
      --border: #e2e8f0;
      --border-accent: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --green-border: #86efac;
      --amber: #d97706;
      --amber-bg: #fffbeb;
      --amber-border: #fcd34d;
      --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --card-bg: #111827;
        --col-bg: #141d2e;
        --col-header: #1e293b;
        --border: #1f2937;
        --border-accent: #374151;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        --accent: #3b82f6;
        --accent-bg: #1e293b;
        --green: #22c55e;
        --green-bg: #064e3b;
        --green-border: #059669;
        --amber: #f59e0b;
        --amber-bg: #451a03;
        --amber-border: #78350f;
      }
    }

    text {
      font-family: var(--font);
      user-select: none;
    }

    .col-container {
      fill: var(--col-bg);
      stroke: var(--border);
      stroke-width: 1.2;
      rx: 6;
    }

    .card-box {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1.2;
      rx: 5;
    }

    /* Keyframes */
    @keyframes moveSavedApplied {
      0%, 15% {
        transform: translateX(0px);
      }
      30%, 85% {
        transform: translateX(150px);
      }
      95%, 100% {
        transform: translateX(0px);
      }
    }

    @keyframes ghostFade {
      0%, 25% {
        opacity: 0.95;
      }
      45%, 85% {
        opacity: 0.28;
      }
      95%, 100% {
        opacity: 0.95;
      }
    }

    @keyframes ghostBadgeAppear {
      0%, 25% {
        opacity: 0;
        transform: scale(0.85);
      }
      45%, 85% {
        opacity: 1;
        transform: scale(1);
      }
      95%, 100% {
        opacity: 0;
        transform: scale(0.85);
      }
    }

    @keyframes moveInterviewOffer {
      0%, 35% {
        transform: translateX(0px);
      }
      52%, 85% {
        transform: translateX(150px);
      }
      95%, 100% {
        transform: translateX(0px);
      }
    }

    @keyframes offerSuccessPulse {
      0%, 45% {
        stroke: var(--border);
        fill: var(--card-bg);
      }
      56%, 85% {
        stroke: var(--green);
        fill: var(--green-bg);
      }
      95%, 100% {
        stroke: var(--border);
        fill: var(--card-bg);
      }
    }

    @keyframes offerSuccessBadge {
      0%, 48% {
        opacity: 0;
        transform: translateY(3px);
      }
      56%, 85% {
        opacity: 1;
        transform: translateY(0);
      }
      95%, 100% {
        opacity: 0;
        transform: translateY(3px);
      }
    }

    .card-saved-to-applied {
      animation: moveSavedApplied 7s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-ghost-target {
      animation: ghostFade 7s infinite ease-in-out;
    }
    .ghost-badge-anim {
      animation: ghostBadgeAppear 7s infinite ease-in-out;
    }
    .card-interview-to-offer {
      animation: moveInterviewOffer 7s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .offer-card-box {
      animation: offerSuccessPulse 7s infinite ease-in-out;
    }
    .offer-badge-anim {
      animation: offerSuccessBadge 7s infinite ease-in-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-saved-to-applied {
        transform: translateX(150px) !important;
        animation: none !important;
      }
      .card-ghost-target {
        opacity: 0.35 !important;
        animation: none !important;
      }
      .ghost-badge-anim {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
      .card-interview-to-offer {
        transform: translateX(150px) !important;
        animation: none !important;
      }
      .offer-card-box {
        stroke: var(--green) !important;
        fill: var(--green-bg) !important;
        animation: none !important;
      }
      .offer-badge-anim {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="var(--bg)" rx="10" />
  <rect x="1" y="1" width="798" height="318" fill="none" stroke="var(--border)" stroke-width="1.5" rx="9" />

  <!-- Top Title / Header -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="var(--text)" letter-spacing="0.5">CAREERFORGE :: APPLICATION TRACKER</text>
    <rect x="290" y="-12" width="138" height="18" rx="9" fill="var(--accent-bg)" />
    <text x="359" y="1" font-size="9" font-weight="600" fill="var(--accent)" text-anchor="middle">SQLITE REPO • LOCAL ONLY</text>
  </g>

  <!-- KANBAN BOARD CONTAINER -->
  <g transform="translate(30, 42)">
    <!-- COLUMN 1: SAVED (x=0) -->
    <g transform="translate(0, 0)">
      <rect class="col-container" width="140" height="236" />
      <path d="M 0 6 A 6 6 0 0 1 6 0 L 134 0 A 6 6 0 0 1 140 6 L 140 26 L 0 26 Z" fill="var(--col-header)" />
      <text x="10" y="17" font-size="9" font-weight="700" fill="var(--text)">SAVED</text>
      <rect x="112" y="7" width="18" height="13" rx="6" fill="var(--card-bg)" />
      <text x="121" y="16.5" font-size="8" font-weight="700" fill="var(--text-muted)" text-anchor="middle">1</text>
    </g>

    <!-- COLUMN 2: APPLIED (x=150) -->
    <g transform="translate(150, 0)">
      <rect class="col-container" width="140" height="236" />
      <path d="M 0 6 A 6 6 0 0 1 6 0 L 134 0 A 6 6 0 0 1 140 6 L 140 26 L 0 26 Z" fill="var(--col-header)" />
      <text x="10" y="17" font-size="9" font-weight="700" fill="var(--text)">APPLIED</text>
      <rect x="112" y="7" width="18" height="13" rx="6" fill="var(--card-bg)" />
      <text x="121" y="16.5" font-size="8" font-weight="700" fill="var(--text-muted)" text-anchor="middle">2</text>
    </g>

    <!-- COLUMN 3: SCREEN (x=300) -->
    <g transform="translate(300, 0)">
      <rect class="col-container" width="140" height="236" />
      <path d="M 0 6 A 6 6 0 0 1 6 0 L 134 0 A 6 6 0 0 1 140 6 L 140 26 L 0 26 Z" fill="var(--col-header)" />
      <text x="10" y="17" font-size="9" font-weight="700" fill="var(--text)">SCREEN</text>
      <rect x="112" y="7" width="18" height="13" rx="6" fill="var(--card-bg)" />
      <text x="121" y="16.5" font-size="8" font-weight="700" fill="var(--text-muted)" text-anchor="middle">1</text>
    </g>

    <!-- COLUMN 4: INTERVIEW (x=450) -->
    <g transform="translate(450, 0)">
      <rect class="col-container" width="140" height="236" />
      <path d="M 0 6 A 6 6 0 0 1 6 0 L 134 0 A 6 6 0 0 1 140 6 L 140 26 L 0 26 Z" fill="var(--col-header)" />
      <text x="10" y="17" font-size="9" font-weight="700" fill="var(--text)">INTERVIEW</text>
      <rect x="112" y="7" width="18" height="13" rx="6" fill="var(--card-bg)" />
      <text x="121" y="16.5" font-size="8" font-weight="700" fill="var(--text-muted)" text-anchor="middle">1</text>
    </g>

    <!-- COLUMN 5: OFFER (x=600) -->
    <g transform="translate(600, 0)">
      <rect class="col-container" width="140" height="236" />
      <path d="M 0 6 A 6 6 0 0 1 6 0 L 134 0 A 6 6 0 0 1 140 6 L 140 26 L 0 26 Z" fill="var(--green-bg)" />
      <text x="10" y="17" font-size="9" font-weight="700" fill="var(--green)">OFFER</text>
      <rect x="112" y="7" width="18" height="13" rx="6" fill="var(--card-bg)" />
      <text x="121" y="16.5" font-size="8" font-weight="700" fill="var(--green)" text-anchor="middle">1</text>
    </g>

    <!-- ================= STATIC / RESIDENT CARDS ================= -->

    <!-- Stagnant Card in APPLIED: Apex Scale (Ghosted Detection) -->
    <g transform="translate(158, 36)">
      <!-- Animated Fading Box -->
      <g class="card-ghost-target">
        <rect class="card-box" width="124" height="66" />
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="var(--text)">Apex Systems</text>
        <text x="8" y="26" font-size="7.5" fill="var(--text-muted)">Staff Python Dev</text>
        <line x1="8" y1="32" x2="116" y2="32" stroke="var(--border)" stroke-width="0.8" />
        <text x="8" y="44" font-size="7.5" fill="var(--text-dim)">Applied: 24d ago</text>
        <text x="8" y="56" font-size="7" fill="var(--text-dim)">Zero follow-ups</text>
      </g>

      <!-- Overlay Ghost Alert Badge -->
      <g class="ghost-badge-anim" transform="translate(10, 22)">
        <rect width="104" height="24" rx="4" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1.2" />
        <text x="52" y="15" font-size="8" font-weight="700" fill="var(--amber)" text-anchor="middle">👻 GHOSTED (24d)</text>
      </g>
    </g>

    <!-- Steady Card in SCREEN: DataLoop -->
    <g transform="translate(308, 36)">
      <rect class="card-box" width="124" height="66" />
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="var(--text)">DataLoop AI</text>
      <text x="8" y="26" font-size="7.5" fill="var(--text-muted)">Data Platform Eng</text>
      <line x1="8" y1="32" x2="116" y2="32" stroke="var(--border)" stroke-width="0.8" />
      <rect x="8" y="38" width="108" height="18" rx="3" fill="var(--accent-bg)" />
      <text x="62" y="50" font-size="7.5" font-weight="600" fill="var(--accent)" text-anchor="middle">Call: Fri 3:00 PM</text>
    </g>

    <!-- ================= DYNAMIC / MOVING CARDS ================= -->

    <!-- CARD 1: Moves from SAVED to APPLIED -->
    <g class="card-saved-to-applied" transform="translate(8, 36)">
      <rect class="card-box" width="124" height="66" />
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="var(--text)">Veloce Cloud</text>
      <text x="8" y="26" font-size="7.5" fill="var(--text-muted)">Backend Specialist</text>
      <line x1="8" y1="32" x2="116" y2="32" stroke="var(--border)" stroke-width="0.8" />
      <rect x="8" y="40" width="108" height="18" rx="3" fill="var(--accent-bg)" />
      <text x="62" y="52" font-size="7.5" font-weight="600" fill="var(--accent)" text-anchor="middle">Tailored CV Ready</text>
    </g>

    <!-- CARD 2: Moves from INTERVIEW to OFFER -->
    <g class="card-interview-to-offer" transform="translate(458, 36)">
      <rect class="card-box offer-card-box" width="124" height="66" />
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="var(--text)">OmniCore Tech</text>
      <text x="8" y="26" font-size="7.5" fill="var(--text-muted)">Senior Systems Dev</text>
      <line x1="8" y1="32" x2="116" y2="32" stroke="var(--border)" stroke-width="0.8" />
      
      <!-- Normal stage label -->
      <text x="8" y="46" font-size="7.5" fill="var(--text-dim)">Round 3 Cleared</text>

      <!-- Offer celebration badge -->
      <g class="offer-badge-anim" transform="translate(8, 38)">
        <rect width="108" height="20" rx="3" fill="var(--green)" />
        <text x="54" y="13.5" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">🎉 $165k OFFER</text>
      </g>
    </g>

    <!-- Bottom summary status inside board -->
    <g transform="translate(10, 218)">
      <text x="0" y="0" font-size="8" fill="var(--text-dim)">Run: `forge ghost` to audit stalled applications • `forge track report` for analytics</text>
    </g>
  </g>

  <!-- Bottom Global Banner / Tagline -->
  <g transform="translate(400, 304)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="var(--text)" text-anchor="middle" letter-spacing="0.2">
      "Know exactly where every application stands."
    </text>
  </g>
</svg>