name: CareerForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (no pywin32 on Linux)
        run: |
          pip install --upgrade pip
          grep -v pywin32 requirements.txt | pip install -r /dev/stdin

      - name: Verify CLI loads
        run: python cli.py --help

      - name: Verify core imports
        run: |
          python -c "from core.cv_builder import build_universal_cv; print('cv_builder OK')"
          python -c "from core.anti_ai_engine import audit_text; print('anti_ai_engine OK')"
          python -c "from core.profile_loader import load_profile; print('profile_loader OK')"
          python -c "from scrapers.greenhouse_scanner import scan_all_greenhouse; print('greenhouse_scanner OK')"
          python -c "from scrapers.ashby_scanner import scan_all_ashby; print('ashby_scanner OK')"
          python -c "from scrapers.remotive_scanner import scan_remotive; print('remotive_scanner OK')"
          python -c "from scrapers.work_mode_config import get_work_modes; print('work_mode_config OK')"

      - name: Run Anti-AI audit on standards doc
        run: python cli.py audit --file rules/anti_ai_standards.md
