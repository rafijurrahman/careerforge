name: CareerForge CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  unit-test:
    name: Unit Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest Suite (Network Disabled via pytest-socket)
        run: |
          pytest -v --disable-socket -m "not office"

  pagefit:
    name: Page-Fit Real Engine (${{ matrix.os }})
    needs: unit-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install LibreOffice on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install libreoffice-fresh -y --no-progress --ignore-package-exit-codes=3010,1641
          # Expose soffice via a clean shim pointing to soffice.com so it outputs immediately without shadowing runner Python
          $shimDir = "C:\soffice-bin"
          New-Item -ItemType Directory -Path $shimDir -Force | Out-Null
          $sofficeBin = "C:\Program Files\LibreOffice\program\soffice.com"
          if (-not (Test-Path $sofficeBin)) {
            $sofficeBin = "C:\Program Files\LibreOffice\program\soffice.exe"
          }
          Set-Content -Path "$shimDir\soffice.cmd" -Value "@`"$sofficeBin`" %*"
          Add-Content -Path $env:GITHUB_PATH -Value $shimDir

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice
          echo "/Applications/LibreOffice.app/Contents/MacOS" >> $GITHUB_PATH

      - name: Verify soffice installation
        run: |
          soffice --version

      - name: Install CareerForge & pypdf
        run: |
          python -m pip install --upgrade pip
          pip install -e . pypdf

      - name: Verify forge doctor engine detection
        run: |
          forge doctor

      - name: Generate 1-Page CV with LibreOffice Engine
        run: |
          forge apply --engine libreoffice --profile examples/profile.example.yaml --out out/

      - name: Assert PDF Page Count == 1
        shell: python
        run: |
          import glob
          import sys
          import pypdf

          pdfs = glob.glob("out/*.pdf")
          if not pdfs:
              print("Error: No PDF generated in out/ directory!", file=sys.stderr)
              sys.exit(1)

          pdf_file = pdfs[0]
          reader = pypdf.PdfReader(pdf_file)
          page_count = len(reader.pages)
          print(f"Verified PDF: {pdf_file}")
          print(f"Total Pages: {page_count}")

          if page_count != 1:
              print(f"FAIL: Expected exact 1-page document, but generated {page_count} pages!", file=sys.stderr)
              sys.exit(1)

          print("SUCCESS: Exact 1-page PDF verified by pypdf!")
