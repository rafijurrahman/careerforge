[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careerforge"
version = "0.2.0"
authors = [
  { name="CareerForge Contributors" },
]
description = "A universal, local-first, privacy-focused job application and career automation engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "python-docx>=0.8.11",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pywin32>=306; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/careerforge/careerforge"
"Bug Tracker" = "https://github.com/careerforge/careerforge/issues"

[project.scripts]
careerforge = "cli:main"
forge = "cli:main"
