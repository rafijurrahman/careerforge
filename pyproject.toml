[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Primary package name on PyPI.
# If "careerforge" is already claimed, rename to "careerforge-cli"
name = "careerforge"
# name = "careerforge-cli"  # Fallback PyPI package name
version = "0.2.0"
description = "A universal, local-first, privacy-focused job application and career automation engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "rafijurrahman", email = "145068278+rafijurrahman@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "python-docx>=0.8.11",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "pdfminer.six>=20231228",
    "rich>=13.0.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; platform_system=='Windows'",
]
dev = [
    "pytest>=7.4.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
"Homepage" = "https://github.com/rafijurrahman/careerforge"
"Bug Tracker" = "https://github.com/rafijurrahman/careerforge/issues"
"Documentation" = "https://github.com/rafijurrahman/careerforge#readme"

[project.scripts]
careerforge = "careerforge.cli:main"
forge = "careerforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["careerforge*"]

[tool.setuptools.package-data]
"careerforge.data" = ["*.yaml", "*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "office: tests requiring local Microsoft Office installation"
]
